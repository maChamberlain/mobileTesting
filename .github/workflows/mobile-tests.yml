name: Mobile Chrome Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Must match the AVD the tests expect (wdio.conf.ts -> AVD_NAME)
  AVD_NAME: pixel7_api34
  API_LEVEL: 34
  # Keep drivers out of the project folder so package.json isn't modified
  APPIUM_HOME: ${{ github.workspace }}/../appium-home

jobs:
  test:
    timeout-minutes: 45
    # Linux runners support KVM, which the x86_64 emulator needs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        run: npm ci

      - name: Install Appium UiAutomator2 driver
        run: npx appium driver install uiautomator2@8.7.0

      - name: Type-check
        run: npx tsc -p .

      # Snapshot of a booted emulator, so later runs skip the cold boot
      - name: Cache AVD
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-google_apis-x86_64-pixel_7-ram4g

      - name: Create AVD and generate snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          # Chrome crashed ("not connected to DevTools") with the default RAM
          ram-size: 4096M
          cores: 4
          avd-name: ${{ env.AVD_NAME }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          # Chrome crashed ("not connected to DevTools") with the default RAM
          ram-size: 4096M
          cores: 4
          avd-name: ${{ env.AVD_NAME }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The emulator is already booted here, so the `appium:avd` capability reuses it
          script: npm test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-output
          path: |
            logs/
            screenshots/
          retention-days: 30
